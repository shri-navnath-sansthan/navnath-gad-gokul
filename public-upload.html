<!DOCTYPE html>
<html lang="mr">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>तुमचे फोटो शेअर करा | गोकुळ</title>

<style>

*{
  box-sizing:border-box;
}

body{

  margin:0;

  font-family:
    Arial,
    "Noto Sans Devanagari",
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #f5f8ef,
      #ffffff
    );

  color:#34412b;

}

.public-upload-box{

  width:92%;

  max-width:650px;

  margin:40px auto;

  padding:28px 22px;

  background:#ffffff;

  border-radius:25px;

  border:2px solid #a9b78b;

  box-shadow:
    0 10px 30px
    rgba(70,90,40,.15);

}

.public-upload-header{

  text-align:center;

  margin-bottom:25px;

}

.public-upload-header h1{

  margin:0 0 10px;

  color:#52672f;

  font-size:28px;

}

.public-upload-header p{

  margin:0;

  color:#68735d;

  font-size:16px;

  line-height:1.6;

}

.form-group{

  margin-bottom:18px;

}

.form-group label{

  display:block;

  margin-bottom:7px;

  font-weight:700;

  color:#52672f;

}

.form-group input,
.form-group textarea{

  width:100%;

  padding:12px;

  border:1px solid #b7c29d;

  border-radius:12px;

  outline:none;

  font-size:16px;

  background:#fbfcf8;

}

.form-group textarea{

  min-height:100px;

  resize:vertical;

}

.form-group input:focus,
.form-group textarea:focus{

  border-color:#657a3a;

  box-shadow:
    0 0 0 3px
    rgba(101,122,58,.10);

}

#image{

  background:#f5f8ef;

}

#preview{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:10px;

  margin-top:12px;

}

.preview-img{

  width:100%;

  aspect-ratio:1/1;

  object-fit:cover;

  border-radius:10px;

  border:1px solid #c8d0b5;

}

.submit-btn{

  width:100%;

  border:none;

  padding:14px;

  border-radius:14px;

  background:
    linear-gradient(
      135deg,
      #657a3a,
      #879b55
    );

  color:white;

  font-size:18px;

  font-weight:800;

  cursor:pointer;

  transition:.3s;

}

.submit-btn:hover{

  transform:translateY(-2px);

  box-shadow:
    0 7px 18px
    rgba(80,100,45,.25);

}

.submit-btn:disabled{

  opacity:.6;

  cursor:not-allowed;

}

.info-box{

  margin-top:20px;

  padding:15px;

  border-radius:14px;

  background:#f3f7ec;

  border:1px solid #c4cfad;

  text-align:center;

  line-height:1.6;

  font-size:14px;

}

#status{

  margin-top:18px;

  text-align:center;

  font-weight:700;

}

.back-btn{

  display:block;

  width:max-content;

  margin:20px auto 0;

  text-decoration:none;

  color:#52672f;

  font-weight:700;

}

@media(max-width:480px){

  .public-upload-box{

    width:94%;

    margin:20px auto;

    padding:20px 14px;

    border-radius:20px;

  }

  .public-upload-header h1{

    font-size:22px;

  }

  .public-upload-header p{

    font-size:14px;

  }

  #preview{

    grid-template-columns:
      repeat(2,1fr);

  }

}

</style>

</head>

<body>

<div class="public-upload-box">

  <div class="public-upload-header">

    <h1>📸 तुमचे फोटो शेअर करा</h1>

    <p>
      गोकुळ गावाचे सुंदर क्षण आणि आठवणी
      आपल्या Gallery मध्ये शेअर करा.
    </p>

  </div>

  <form id="publicUploadForm">

    <div class="form-group">

      <label>
        👤 तुमचे नाव
      </label>

      <input
        type="text"
        id="name"
        placeholder="तुमचे नाव लिहा"
        maxlength="50"
        required
      >

    </div>

    <div class="form-group">

      <label>
        📝 फोटोबद्दल माहिती
      </label>

      <textarea
        id="caption"
        placeholder="फोटो कुठला आहे किंवा त्याबद्दल थोडी माहिती..."
        maxlength="300"
      ></textarea>

    </div>

    <div class="form-group">

      <label>
        📷 फोटो निवडा
      </label>

      <input
        type="file"
        id="image"
        accept="image/*"
        multiple
        required
      >

      <div id="preview"></div>

    </div>

    <button
      type="submit"
      class="submit-btn"
      id="submitBtn"
    >

      📤 फोटो शेअर करा

    </button>

  </form>

  <div class="info-box">

    ⏳ <strong>महत्त्वाची सूचना:</strong><br>

    फोटो पाठवल्यानंतर तो Admin कडून तपासला जाईल.
    मंजुरी मिळाल्यानंतरच फोटो
    Gallery मध्ये दिसेल.

  </div>

  <div id="status"></div>

  <a
    href="index.html"
    class="back-btn"
  >
    ← मुख्य पृष्ठावर जा
  </a>

</div>

<script>

const form =
  document.getElementById(
    "publicUploadForm"
  );

const fileInput =
  document.getElementById(
    "image"
  );

const preview =
  document.getElementById(
    "preview"
  );

const status =
  document.getElementById(
    "status"
  );

const submitBtn =
  document.getElementById(
    "submitBtn"
  );

/* ================= PREVIEW ================= */

fileInput.addEventListener(
  "change",
  function(){

    preview.innerHTML = "";

    const files =
      fileInput.files;

    if(files.length > 5){

      alert(
        "जास्तीत जास्त 5 फोटो निवडा."
      );

      fileInput.value = "";

      return;
    }

    for(
      let i=0;
      i<files.length;
      i++
    ){

      const img =
        document.createElement(
          "img"
        );

      img.className =
        "preview-img";

      img.src =
        URL.createObjectURL(
          files[i]
        );

      preview.appendChild(
        img
      );

    }

  }
);

/* ================= UPLOAD ================= */

form.addEventListener(
  "submit",
  async function(e){

    e.preventDefault();

    const files =
      fileInput.files;

    if(
      !files ||
      files.length === 0
    ){

      alert(
        "कृपया फोटो निवडा."
      );

      return;
    }

    if(files.length > 5){

      alert(
        "जास्तीत जास्त 5 फोटो निवडा."
      );

      return;
    }

    submitBtn.disabled = true;

    status.innerText =
      "📤 फोटो पाठवत आहे...";

    status.style.color =
      "#52672f";

    const formData =
      new FormData();

    formData.append(
      "name",
      document.getElementById(
        "name"
      ).value
    );

    formData.append(
      "caption",
      document.getElementById(
        "caption"
      ).value
    );

    for(
      let i=0;
      i<files.length;
      i++
    ){

      formData.append(
        "image",
        files[i]
      );

    }

    try{

      const response =
        await fetch(
          "https://navnath-upload-server.onrender.com/public-upload",
          {
            method:"POST",
            body:formData
          }
        );

      const data =
        await response.json();

      if(data.success){

        status.innerText =
          "✅ फोटो यशस्वीपणे पाठवले आहेत! Admin मंजुरीनंतर ते Gallery मध्ये दिसतील.";

        status.style.color =
          "#2e7d32";

        form.reset();

        preview.innerHTML = "";

      }else{

        status.innerText =
          "❌ " +
          (
            data.message ||
            "फोटो पाठवता आले नाहीत."
          );

        status.style.color =
          "#c62828";

      }

    }catch(error){

      console.error(error);

      status.innerText =
        "❌ Server शी संपर्क होऊ शकला नाही.";

      status.style.color =
        "#c62828";

    }

    submitBtn.disabled = false;

  }
);

</script>

</body>

</html>
